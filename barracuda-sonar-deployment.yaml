apiVersion: apps/v1
kind: Deployment
metadata:
  name: barracuda-sonar
  labels:
    app: barracuda-sonar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: barracuda-sonar
  template:
    metadata:
      labels:
        app: barracuda-sonar
    spec:
      nodeSelector:
        kubefamily: raspberrypi
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: barracuda-sonar
          image: ghcr.io/usc-robosub/barracuda-sonar:main
          imagePullPolicy: Always
          command: ["/bin/bash", "/opt/barracuda-sonar/entrypoint.sh"]
          env:
            - name: ROS_MASTER_URI
              value: "http://barracuda-description.default.svc.cluster.local:11311"
            - name: ROS_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          tty: true
          securityContext:
            privileged: false
      restartPolicy: Always
