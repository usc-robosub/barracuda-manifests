apiVersion: apps/v1
kind: Deployment
metadata:
  name: barracuda-localization
  labels:
    app: barracuda-localization
spec:
  replicas: 1
  selector:
    matchLabels:
      app: barracuda-localization
  template:
    metadata:
      labels:
        app: barracuda-localization
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: barracuda-localization
          image: ghcr.io/usc-robosub/barracuda-localization:nightly  # Replace with actual image
          command: ["/bin/bash", "/opt/barracuda-localization/entrypoint.sh"]
          env:
            - name: ROS_MASTER_URI
              value: "http://barracuda-description-service:11311"
            - name: ROS_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          tty: true
          securityContext:
            runAsUser: 0  # Run as root to match docker-compose
      restartPolicy: Always

