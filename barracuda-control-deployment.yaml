apiVersion: apps/v1
kind: Deployment
metadata:
  name: barracuda-control
  labels:
    app: barracuda-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: barracuda-control
  template:
    metadata:
      labels:
        app: barracuda-control
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: barracuda-control
          image: ghcr.io/usc-robosub/barracuda-control:latest
          imagePullPolicy: Always
          env:
            - name: ROS_MASTER_URI
              value: "http://barracuda-description.default.svc.cluster.local:11311"
            - name: ROS_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          tty: true
          securityContext:
            runAsUser: 0
      restartPolicy: Always

